<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سِياق — مرجع المطوّر العربي للذكاء الاصطناعي</title>
<meta name="description" content="برومبتات وأكواد عربية جاهزة، بصيغ جاهزة للـ API.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--p1:#161b22;--p2:#1c2230;--p3:#21262d;
  --bd:#30363d;--bd2:#484f58;
  --tx:#f0f3f6;--mut:#9198a1;--dim:#8b949e;
  --ac:#4ade9e;--ac2:rgba(74,222,158,.11);--gold:#d6b872;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:var(--tx);
  background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;font-size:14.5px;line-height:1.7;
  -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
::selection{background:var(--ac2);color:var(--ac)}
*{scrollbar-width:thin;scrollbar-color:#30363d transparent}

.top{height:54px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--bd);background:rgba(13,17,23,.92);backdrop-filter:blur(10px);position:relative}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.2px}
.mark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),#1f9d6a);color:#04140c;font-weight:700;font-size:15px}
.sp{flex:1}
.kbtn{display:flex;align-items:center;gap:10px;min-width:260px;padding:7px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--p1);color:var(--mut);transition:.15s}
.kbtn:hover{border-color:var(--bd2);color:var(--tx)}
kbd{font-family:var(--mono);font-size:11px;padding:1px 6px;border:1px solid var(--bd2);border-radius:5px;background:var(--p2);color:var(--mut);margin-inline-start:auto;direction:ltr}
.lnk{color:var(--mut);text-decoration:none;padding:6px 10px;border-radius:8px}
.lnk:hover{color:var(--tx);background:var(--p2)}

.burger{display:none;width:38px;height:38px;border:1px solid var(--bd);border-radius:8px;background:var(--p1);place-items:center}
.burger i,.burger i::before,.burger i::after{display:block;width:16px;height:2px;background:var(--tx);border-radius:2px;content:"";position:relative;transition:.15s}
.burger i::before{position:absolute;top:-5px}.burger i::after{position:absolute;top:5px}
.tnav{display:flex;gap:2px;margin-inline-start:8px}
.tnav a{color:var(--mut);text-decoration:none;padding:6px 10px;border-radius:6px;font-size:14px}
.tnav a:hover,.tnav a.on{color:var(--tx);background:var(--p1)}
.drawer{position:fixed;inset:54px 0 0 0;z-index:30;background:var(--bg);overflow:auto;padding:6px 18px 40px}
.drawer[hidden]{display:none}
.drawer h4{color:var(--mut);font-size:12px;font-weight:500;margin:16px 0 2px;letter-spacing:.4px}
.drawer a,.drawer button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;padding:13px 4px;border:0;border-bottom:1px solid var(--bd);font-size:16px;color:var(--tx);text-decoration:none;background:none}
.drawer .on{color:var(--ac)}
.drawer span{color:var(--mut);font-family:var(--mono);font-size:13px}
.intro{flex:none;display:flex;align-items:center;gap:24px;padding:14px 22px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.intro h1{font-size:20px;font-weight:700;line-height:1.4}
.intro h1 em{font-style:normal;color:var(--ac)}
.intro p{color:var(--mut);font-size:13.5px;margin-top:2px;max-width:60ch}
.intro .stats{margin-inline-start:auto;display:flex;gap:18px;color:var(--mut);font-size:13px}
.intro .stats b{color:var(--tx);font-family:var(--mono);font-size:15px;margin-inline-end:5px}
.sfoot{flex:none;border-top:1px solid var(--bd);padding:8px 16px;text-align:center;font-size:12.5px;color:var(--mut)}.sfoot a{color:inherit;text-decoration:none}.sfoot a:hover{text-decoration:underline}.app{flex:1;min-height:0;display:grid;grid-template-columns:232px 372px 1fr}
.side,.list,.detail{overflow:auto;min-height:0}
.side{border-inline-end:1px solid var(--bd);padding:18px 12px;background:var(--p1)}
.list{border-inline-end:1px solid var(--bd);display:flex;flex-direction:column}
.sh{font-size:11.5px;color:var(--dim);padding:14px 10px 6px;letter-spacing:.5px}
.nav{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:8px;color:var(--mut);text-align:start;transition:.12s}
.nav:hover{background:var(--p2);color:var(--tx)}
.nav.on{background:var(--p3);color:var(--tx)}
.nav.on .dot{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
.cnt{margin-inline-start:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}

.lhead{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px;border-bottom:1px solid var(--bd)}
.lhead input{width:100%;background:var(--p1);border:1px solid var(--bd);border-radius:9px;padding:8px 12px;outline:0;transition:.15s}
.lhead input:focus{border-color:rgba(74,222,158,.5);box-shadow:0 0 0 3px var(--ac2)}
.lhead input::placeholder{color:var(--dim)}
.item{display:block;width:100%;text-align:start;padding:13px 16px;border-bottom:1px solid var(--bd);border-inline-start:2px solid transparent;transition:.12s}
.item:hover{background:var(--p1)}
.item.sel{background:var(--p2);border-inline-start-color:var(--ac)}
.item .t{font-weight:600;font-size:14.5px}
.item .d{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{display:flex;gap:8px;margin-top:5px;font-size:11.5px;color:var(--dim)}
.pill{padding:0 8px;border:1px solid var(--bd);border-radius:6px;font-size:11.5px;color:var(--mut)}
.pill.g{color:var(--gold);border-color:rgba(214,184,114,.25)}
.pill.a{color:var(--ac);border-color:rgba(74,222,158,.25)}
.none{padding:48px 20px;text-align:center;color:var(--dim)}
.hint{margin-top:auto;position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:10px 14px;display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.hint kbd{margin:0 4px 0 0}

.detail{padding:30px 40px 60px}
.back{display:none;color:var(--mut);margin-bottom:12px}
.crumb{font-size:12.5px;color:var(--dim);margin-bottom:10px}
.crumb b{color:var(--mut);font-weight:500}
.dh{display:flex;align-items:flex-start;gap:12px}
.dh h1{font-size:28px;font-weight:700;letter-spacing:-.2px;line-height:1.35}
.star{margin-inline-start:auto;padding:7px 11px;border:1px solid var(--bd);border-radius:9px;color:var(--mut);transition:.15s;white-space:nowrap}
.star:hover{border-color:var(--bd2);color:var(--tx)}
.star.on{color:var(--gold);border-color:rgba(214,184,114,.35);background:rgba(214,184,114,.06)}
.desc{color:var(--mut);margin:6px 0 14px;max-width:62ch}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.vh{font-size:12px;color:var(--dim);margin:0 0 10px;letter-spacing:.4px}
.vars{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:26px}
.f label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px}
.f textarea{width:100%;resize:vertical;min-height:40px;background:var(--p1);border:1px solid var(--bd);border-radius:9px;padding:8px 12px;outline:0;transition:.15s}
.f textarea:focus{border-color:rgba(74,222,158,.5);box-shadow:0 0 0 3px var(--ac2)}

.out{border:1px solid var(--bd);border-radius:14px;background:var(--p1);overflow:hidden;box-shadow:0 20px 50px -30px #000}
.oh{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--bd);background:var(--p2)}
.lights{display:flex;gap:6px;margin-inline-end:8px}
.lights i{width:9px;height:9px;border-radius:50%;background:#30363d}
.fmt{padding:3px 11px;border-radius:7px;color:var(--mut);font-size:12.5px;font-family:var(--mono);transition:.12s}
.fmt:hover{color:var(--tx)}
.fmt.on{background:var(--p3);color:var(--ac)}
.cp{margin-inline-start:auto;padding:5px 14px;border-radius:8px;background:var(--ac);color:#04140c;font-weight:600;font-size:13px;transition:.15s}
.cp:hover{filter:brightness(1.1)}
.cp.ok{background:var(--p3);color:var(--ac)}
.ob{padding:18px 20px;max-height:56vh;overflow:auto}
.pt{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:2}
.ph{color:var(--gold);background:rgba(214,184,114,.09);border-radius:5px;padding:0 5px;font-family:var(--mono);font-size:13px;direction:ltr;display:inline-block}
.fv{color:var(--ac);background:var(--ac2);border-radius:5px;padding:0 4px}
.code{direction:ltr;text-align:left;font-family:var(--mono);font-size:13px;line-height:1.85}
.ln{display:flex}
.ln span:first-child{width:34px;flex:none;color:var(--dim);user-select:none;text-align:right;padding-right:16px}
.ln span:last-child{white-space:pre-wrap;word-break:break-word}
.code i{font-style:normal}
.code .k{color:#c4a1ff}.code .s{color:#8fe3b4}.code .c{color:#6e7681}.code .n{color:#f0b27a}
.blank{height:100%;display:grid;place-items:center;color:var(--dim)}

.pal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;justify-content:center;padding-top:14vh}
.pal[hidden]{display:none}
.pb{width:min(580px,92vw);height:fit-content;background:var(--p1);border:1px solid var(--bd2);border-radius:16px;overflow:hidden;box-shadow:0 40px 100px -20px #000}
.pb input{width:100%;padding:16px 20px;background:none;border:0;border-bottom:1px solid var(--bd);outline:0;font-size:16px}
.pr{max-height:340px;overflow:auto;padding:8px}
.pi{display:flex;gap:10px;align-items:center;width:100%;text-align:start;padding:10px 12px;border-radius:9px}
.pi.on{background:var(--p3)}
.pi small{color:var(--dim);margin-inline-start:auto}

#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,12px);background:var(--p3);border:1px solid var(--bd2);color:var(--ac);padding:9px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
#toast.s{opacity:1;transform:translate(-50%,0)}

@media(max-width:960px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border:0;border-bottom:1px solid var(--bd)}
  .sh{display:none}.nav{width:auto;white-space:nowrap;border:1px solid var(--bd)}
  .detail{position:fixed;inset:54px 0 0 0;z-index:20;background:var(--bg);display:none;padding:20px 18px 60px}
  .detail.open{display:block}.back{display:block}
  .kbtn{min-width:0;flex:none;padding:8px 12px}.kbtn kbd,.kbtn span,.lnk{display:none}.hint{display:none}
  .burger{display:grid}.tnav{display:none}
  .intro{padding:10px 14px}.intro h1{font-size:16px}.intro p,.intro .stats{display:none}
}
@media(min-width:961px){.drawer{display:none!important}}
</style>
</head>
<body>

<header class="top">
  <button class="burger" id="burger" aria-label="القائمة" aria-expanded="false"><i></i></button>
  <div class="logo"><div class="mark">س</div>سِياق</div>
  <nav class="tnav" id="tnav"><a href="#" data-t="prompt">البرومبتات</a><a href="#" data-t="code">الأكواد</a><a href="/tools/">الأدوات</a><a href="/faq/">الأسئلة</a><a href="/api/">API</a><a href="/about/">عن الموقع</a></nav>
  <div class="sp"></div>
  <button class="kbtn" id="open-pal">⌕ <span>ابحث في المكتبة…</span><kbd>Ctrl K</kbd></button>
  <a class="lnk" href="https://github.com/khly500/suyaq-ai" target="_blank" rel="noopener">GitHub</a><a class="lnk sg" href="https://github.com/khly500/suyaq-reference/issues/new?template=prompt_suggestion.yml" target="_blank" rel="noopener">اقترح برومبت</a>
</header>
<div class="drawer" id="drawer" hidden></div>
<section class="intro"><div><h1>مرجع المطوّر العربي <em>للذكاء الاصطناعي</em></h1><p>برومبتات وأكواد عربية جاهزة للنسخ والتجربة، مع أمثلة API لـ OpenAI وClaude وGemini. مجاني ومفتوح المصدر.</p></div><div class="stats" id="stats"></div></section>

<div class="app" role="main">
  <aside class="side" id="side"></aside>
  <section class="list">
    <div class="lhead"><input id="flt" placeholder="تصفية القائمة…" autocomplete="off"></div>
    <div id="items"></div>
    <div class="hint">
      <span><kbd>Alt</kbd>+<kbd>J</kbd><kbd>K</kbd> تنقل</span><span><kbd>Alt</kbd>+<kbd>C</kbd> نسخ</span><span><kbd>Alt</kbd>+<kbd>/</kbd> تصفية</span>
    </div>
  </section>
  <article class="detail" id="detail"></article>
</div>

<footer class="sfoot"><a href="/about/">عن الموقع</a> · <a href="/privacy/">الخصوصية</a> · <a href="/api/">API</a> · <a href="https://github.com/khly500/suyaq-reference/issues/new?template=prompt_suggestion.yml" target="_blank" rel="noopener">اقترح برومبت</a></footer><div class="pal" id="pal" hidden>
  <div class="pb">
    <input id="pi" placeholder="ابحث عن برومبت أو كود…" autocomplete="off">
    <div class="pr" id="pr"></div>
  </div>
</div>
<div id="toast"></div>

<script src="data.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.replace(/[\u064B-\u0652\u0640]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase();
const toast=m=>{const t=$('toast');t.textContent=m;t.className='s';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',1500)};

DATA.forEach(d=>{d.desc=d.desc||(d.type==='prompt'?((ls)=>ls.find(x=>!/^أنت /.test(x))||ls[0])(d.body.split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean)).split('\n')[0]:d.lang+' · '+d.title)});

const loadFav=()=>{try{const a=JSON.parse(localStorage.getItem('fav')||'[]');return Array.isArray(a)?a.filter(id=>DATA.some(d=>d.id===id)):[]}catch(e){return[]}};
const saveFav=v=>{try{localStorage.setItem('fav',JSON.stringify(v))}catch(e){}};
const clipW=t=>new Promise((res,rej)=>{const fb=()=>{try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();const r=document.execCommand('copy');a.remove();r?res():rej()}catch(e){rej(e)}};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(res,fb);else fb()});
const st={type:'prompt',cat:'الكل',q:'',sel:null,fmt:'text',vals:{},fav:loadFav()};
const TYPES={prompt:'برومبتات',code:'أكواد'};

const KW=/^(import|export|from|def|return|const|let|var|if|else|for|in|class|new|await|async|function|print|None|True|False|as|with|try|except|catch|finally|raise|throw|yield|lambda)$/;
function hl(s){
  const re=/(#.*|\/\/.*)|('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|`[^`]*`)|([A-Za-z_]\w*)|(\d+)/g;
  let out='',i=0,m;
  while((m=re.exec(s))){
    out+=esc(s.slice(i,m.index));i=re.lastIndex;
    out+= m[1]?`<i class="c">${esc(m[1])}</i>`
        : m[2]?`<i class="s">${esc(m[2])}</i>`
        : m[3]?(KW.test(m[3])?`<i class="k">${m[3]}</i>`:esc(m[3]))
        : `<i class="n">${m[4]}</i>`;
  }
  return out+esc(s.slice(i));
}

const pool=()=>DATA.filter(d=>st.type==='fav'?st.fav.includes(d.id):d.type===st.type);
const visible=()=>{const q=norm(st.q);return pool().filter(d=>(st.cat==='الكل'||d.cat===st.cat)&&(!q||norm(d.title+' '+d.desc+' '+d.cat).includes(q)))};
const cur=()=>DATA.find(d=>d.id===st.sel);
const text=d=>d.body.replace(/\{\{(.+?)\}\}/g,(m,k)=>st.vals[k]||m);

function renderSide(){
  const s=$('side');s.innerHTML='';
  const h=t=>{const e=document.createElement('div');e.className='sh';e.textContent=t;s.append(e)};
  const nav=(label,count,on,fn)=>{const b=document.createElement('button');b.className='nav'+(on?' on':'');
    b.innerHTML='<span class="dot"></span><span></span><span class="cnt"></span>';
    b.children[1].textContent=label;b.children[2].textContent=count;b.onclick=fn;s.append(b)};
  h('المكتبة');
  Object.entries(TYPES).forEach(([k,v])=>nav(v,DATA.filter(d=>d.type===k).length,st.type===k,()=>{st.type=k;st.cat='الكل';go()}));
  if(st.fav.length||st.type==='fav')nav('المفضلة',st.fav.length,st.type==='fav',()=>{st.type='fav';st.cat='الكل';go()});
  h('التصنيفات');
  const p=pool();
  nav('الكل',p.length,st.cat==='الكل',()=>{st.cat='الكل';go()});
  const cats=[...new Set(p.map(d=>d.cat))],seen=new Set(),cn=c=>{seen.add(c);nav(c,p.filter(d=>d.cat===c).length,st.cat===c,()=>{st.cat=c;go()})};[['للمطورين',['برمجة','بيانات','معالجة النص','أرقام وتواريخ','ملفات وبيانات','أدوات مساعدة']],['لصنّاع المحتوى',['كتابة','تسويق','لهجات','محتوى سريع']],['للأعمال والتعليم',['أعمال','خدمة عملاء','عقار','سياحة وتراث','تعليم','بحث']]].forEach(([t,l])=>{const m=l.filter(c=>cats.includes(c));if(m.length){h(t);m.forEach(cn)}});cats.filter(c=>!seen.has(c)).forEach(cn);
}
function renderList(){
  const L=visible(),box=$('items');box.innerHTML='';
  if(!L.length){box.innerHTML='<div class="none">لا توجد نتائج</div>';return}
  L.forEach(d=>{
    const b=document.createElement('button');b.className='item'+(d.id===st.sel?' sel':'');b.dataset.id=d.id;
    const t=document.createElement('div');t.className='t';t.textContent=d.title;
    const e=document.createElement('div');e.className='d';e.textContent=d.desc;
    const m=document.createElement('div');m.className='m';
    const p1=document.createElement('span');p1.className='pill';p1.textContent=d.cat;m.append(p1);
    if(d.lang){const p2=document.createElement('span');p2.className='pill g';p2.textContent=d.lang;m.append(p2)}
    if(st.fav.includes(d.id)){const p3=document.createElement('span');p3.className='pill a';p3.textContent='★';m.append(p3)}
    b.append(t,e,m);b.onclick=()=>select(d.id,true);box.append(b);
  });
}
function go(){
  const L=visible();if(!L.find(d=>d.id===st.sel))st.sel=L[0]?.id||null;
  renderSide();renderList();buildDetail();if(typeof renderTnav==='function')renderTnav();
}
function select(id,open){
  st.sel=id;st.vals={};st.fmt='text';history.replaceState(null,'','#'+id);
  renderList();buildDetail();
  if(open)$('detail').classList.add('open');
  document.querySelector('.item.sel')?.scrollIntoView({block:'nearest'});
}

function buildDetail(){
  const el=$('detail'),d=cur();el.scrollTop=0;
  if(!d){el.innerHTML='<div class="blank">اختر عنصراً من القائمة</div>';return}
  el.innerHTML='';
  const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};

  const back=mk('button','back','→ رجوع');back.onclick=()=>el.classList.remove('open');
  const crumb=mk('div','crumb');crumb.innerHTML='المكتبة / <b></b> / '+'<b></b>';
  crumb.children[0].textContent=TYPES[d.type];crumb.children[1].textContent=d.cat;
  const dh=mk('div','dh');dh.append(mk('h1',null,d.title));
  const star=mk('button','star'+(st.fav.includes(d.id)?' on':''),st.fav.includes(d.id)?'★ محفوظ':'☆ حفظ');
  star.onclick=()=>{st.fav=st.fav.includes(d.id)?st.fav.filter(x=>x!==d.id):[...st.fav,d.id];
    saveFav(st.fav);star.className='star'+(st.fav.includes(d.id)?' on':'');
    star.textContent=st.fav.includes(d.id)?'★ محفوظ':'☆ حفظ';renderSide();renderList()};
  dh.append(star);
  const meta=mk('div','meta');
  meta.append(mk('span','pill',d.cat));
  if(d.lang)meta.append(mk('span','pill g',d.lang));
  const vars=[...new Set([...d.body.matchAll(/\{\{(.+?)\}\}/g)].map(m=>m[1]))];
  if(vars.length)meta.append(mk('span','pill a',vars.length+' متغيرات'));
  el.append(back,crumb,dh,mk('p','desc',d.desc),meta);{const ac=mk('div','acts');ac.style.cssText='display:flex;flex-wrap:wrap;gap:8px;margin:12px 0';const ab=(l,f)=>{const b=mk('button','star',l);b.onclick=f;ac.append(b)};if(d.type==='prompt'){ab('جرّب في ChatGPT',()=>window.open('https://chatgpt.com/?q='+encodeURIComponent(text(d)),'_blank','noopener'));ab('جرّب في Claude',()=>window.open('https://claude.ai/new?q='+encodeURIComponent(text(d)),'_blank','noopener'));ab('جرّب في Gemini',()=>{clipW(text(d)).then(()=>toast('تم نسخ البرومبت، الصقه في Gemini'),()=>toast('تعذّر النسخ، انسخ البرومبت يدوياً'));window.open('https://gemini.google.com/app','_blank','noopener')})}ab('مشاركة',()=>{const u=location.origin+'/p/'+d.id+'/';if(navigator.share)navigator.share({title:d.title,url:u}).catch(()=>{});else clipW(u).then(()=>toast('تم نسخ رابط الصفحة'),()=>toast('تعذّر نسخ الرابط'))});el.append(ac)}

  if(vars.length){
    el.append(mk('div','vh','المتغيرات'));
    const g=mk('div','vars');
    vars.forEach(v=>{
      const f=mk('div','f');f.append(mk('label',null,v));
      const t=mk('textarea');t.rows=(v==='المدخل'||v.length>6)?4:1;t.placeholder='…';
      t.oninput=()=>{st.vals[v]=t.value;paint()};f.append(t);g.append(f)});
    el.append(g);
  }

  const out=mk('div','out'),oh=mk('div','oh'),lights=mk('div','lights');
  lights.innerHTML='<i></i><i></i><i></i>';oh.append(lights);
  const fmts=d.type==='prompt'?[['text','prompt'],['messages','messages'],['python','python'],['curl','curl'],['claude','claude'],['gemini','gemini']]:[['text',d.file||'code']];
  fmts.forEach(([k,l])=>{const b=mk('button','fmt'+(st.fmt===k?' on':''),l);b.dataset.k=k;
    b.onclick=()=>{st.fmt=k;oh.querySelectorAll('.fmt').forEach(x=>x.classList.toggle('on',x.dataset.k===k));paint()};oh.append(b)});
  const cp=mk('button','cp','نسخ');cp.id='cp';cp.onclick=copy;oh.append(cp);
  const ob=mk('div','ob');ob.id='ob';out.append(oh,ob);el.append(out);
  paint();
}

function exportText(d){
  const T=text(d);
  if(st.fmt==='messages')return JSON.stringify([{role:'user',content:T}],null,2);
  if(st.fmt==='python')return `from openai import OpenAI\n\nclient = OpenAI()\nres = client.chat.completions.create(\n    model="gpt-6-luna",\n    messages=[{"role": "user", "content": ${JSON.stringify(T)}}],\n)\nprint(res.choices[0].message.content)`;
  if(st.fmt==='claude')return ['import anthropic','','client = anthropic.Anthropic()','msg = client.messages.create(','    model="claude-sonnet-5-5",','    max_tokens=2048,','    messages=[{"role": "user", "content": '+JSON.stringify(T)+'}],',')','print(msg.content[0].text)'].join(String.fromCharCode(10));if(st.fmt==='gemini')return ['from google import genai','','client = genai.Client()','res = client.models.generate_content(','    model="gemini-3.8-flash",','    contents='+JSON.stringify(T)+',',')','print(res.text)'].join(String.fromCharCode(10));if(st.fmt==='curl'){const b=JSON.stringify({model:'gpt-6-luna',messages:[{role:'user',content:T}]},null,2).replace(/'/g,"'\\''");
    return `curl https://api.openai.com/v1/chat/completions \\\n  -H "Authorization: Bearer $OPENAI_API_KEY" \\\n  -H "Content-Type: application/json" \\\n  -d '${b}'`}
  return T;
}
function paint(){
  const d=cur(),ob=$('ob');if(!d||!ob)return;ob.innerHTML='';
  if(d.type==='prompt'&&st.fmt==='text'){
    const p=document.createElement('div');p.className='pt';
    d.body.split(/(\{\{.+?\}\})/).forEach(seg=>{
      const m=seg.match(/^\{\{(.+?)\}\}$/);
      if(!m){p.append(document.createTextNode(seg));return}
      const s=document.createElement('span');
      if(st.vals[m[1]]){s.className='fv';s.textContent=st.vals[m[1]]}else{s.className='ph';s.textContent=seg}
      p.append(s)});
    ob.append(p);return;
  }
  const box=document.createElement('div');box.className='code';
  (d.type==='code'?d.body:exportText(d)).split('\n').forEach((line,i)=>{
    const r=document.createElement('div');r.className='ln';
    r.innerHTML=`<span>${i+1}</span><span>${hl(line)||' '}</span>`;box.append(r)});
  ob.append(box);
}
function copy(){
  const d=cur();if(!d)return;
  clipW(d.type==='code'?d.body:exportText(d)).then(()=>{
    const b=$('cp');if(b){b.textContent='✓ تم النسخ';b.classList.add('ok');setTimeout(()=>{b.textContent='نسخ';b.classList.remove('ok')},1300)}
    toast('تم النسخ')},()=>toast('تعذّر النسخ، حدّد النص وانسخه يدوياً'));
}

const pal=$('pal'),pi=$('pi'),pr=$('pr');let pl=[],px=0;
function palRender(){
  const q=norm(pi.value);
  pl=DATA.filter(d=>!q||norm(d.title+' '+d.desc+' '+d.cat+' '+(d.lang||'')).includes(q)).slice(0,8);
  px=Math.max(0,Math.min(px,pl.length-1));pr.innerHTML='';
  if(!pl.length){pr.innerHTML='<div class="none">لا نتائج</div>';return}
  pl.forEach((d,i)=>{const b=document.createElement('button');b.className='pi'+(i===px?' on':'');
    const a=document.createElement('span');a.textContent=d.title;const s=document.createElement('small');s.textContent=TYPES[d.type]+' · '+d.cat;
    b.append(a,s);b.onclick=()=>pick(i);pr.append(b)});
}
function pick(i){const d=pl[i];if(!d)return;pal.hidden=true;st.type=d.type;st.cat='الكل';st.q='';$('flt').value='';st.sel=d.id;renderSide();renderList();select(d.id,true);document.querySelector('.item.sel')?.scrollIntoView({block:'center'})}
function openPal(){pal.hidden=false;pi.value='';px=0;palRender();pi.focus()}
pi.oninput=()=>{px=0;palRender()};
pi.onkeydown=e=>{
  if(e.key==='ArrowDown'){e.preventDefault();px=Math.min(px+1,pl.length-1);palRender()}
  else if(e.key==='ArrowUp'){e.preventDefault();px=Math.max(px-1,0);palRender()}
  else if(e.key==='Enter')pick(px);
  else if(e.key==='Escape')pal.hidden=true;
};
pal.onclick=e=>{if(e.target===pal)pal.hidden=true};
$('open-pal').onclick=openPal;
$('flt').oninput=e=>{st.q=e.target.value;go()};

addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyK'){e.preventDefault();openPal();return}
  if(!pal.hidden)return;
  const tag=document.activeElement.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'){if(e.key==='Escape')document.activeElement.blur();return}
  if(e.altKey&&e.code==='Slash'){e.preventDefault();$('flt').focus();return}
  if(e.altKey&&e.code==='KeyC'&&!e.ctrlKey&&!e.metaKey){copy();return}
  const L=visible(),i=L.findIndex(d=>d.id===st.sel);
  if((e.altKey&&e.code==='KeyJ')||e.key==='ArrowDown'){e.preventDefault();if(L[i+1])select(L[i+1].id)}
  if((e.altKey&&e.code==='KeyK')||e.key==='ArrowUp'){e.preventDefault();if(L[i-1])select(L[i-1].id)}
});

function renderStats(){
  const n=t=>DATA.filter(d=>d.type===t).length,cats=new Set(DATA.map(d=>d.cat)).size;
  const box=$('stats');box.innerHTML='';
  [[n('prompt'),'برومبت'],[n('code'),'كود'],[cats,'تصنيف']].forEach(([v,l])=>{const e=document.createElement('span'),b=document.createElement('b');b.textContent=v;e.append(b,l);box.append(e)});
}
function renderTnav(){document.querySelectorAll('#tnav a[data-t]').forEach(a=>{a.classList.toggle('on',a.dataset.t===st.type);a.onclick=e=>{e.preventDefault();st.type=a.dataset.t;st.cat='الكل';go()}})}
function renderDrawer(){
  const dr=$('drawer');dr.innerHTML='';
  const h=t=>{const e=document.createElement('h4');e.textContent=t;dr.append(e)};
  const row=(label,count,on,fn)=>{const b=document.createElement('button');if(on)b.className='on';const a=document.createElement('div');a.textContent=label;const c=document.createElement('span');c.textContent=count;b.append(a,c);b.onclick=()=>{fn();closeDrawer()};dr.append(b)};
  const link=(label,href,ext)=>{const a=document.createElement('a');a.href=href;if(ext){a.target='_blank';a.rel='noopener'}a.textContent=label+(ext?' ↗':'');dr.append(a)};
  h('تصفّح');
  Object.entries(TYPES).forEach(([k,v])=>row(v,DATA.filter(d=>d.type===k).length,st.type===k,()=>{st.type=k;st.cat='الكل';go()}));
  if(st.fav.length)row('المفضلة',st.fav.length,st.type==='fav',()=>{st.type='fav';st.cat='الكل';go()});
  h('التصنيفات');
  const p=pool();row('الكل',p.length,st.cat==='الكل',()=>{st.cat='الكل';go()});
  [...new Set(p.map(d=>d.cat))].forEach(c=>row(c,p.filter(d=>d.cat===c).length,st.cat===c,()=>{st.cat=c;go()}));
  h('المزيد');
  link('الأدوات','/tools/');link('الأسئلة','/faq/');link('أخطاء شائعة','/pitfalls/');link('API','/api/');link('عن الموقع','/about/');link('الخصوصية','/privacy/');
  link('GitHub','https://github.com/khly500/suyaq-reference',true);
  link('اقترح برومبت','https://github.com/khly500/suyaq-reference/issues/new?template=prompt_suggestion.yml',true);
}
function closeDrawer(){$('drawer').hidden=true;$('burger').setAttribute('aria-expanded','false');$('detail').classList.remove('open')}
$('burger').onclick=()=>{const dr=$('drawer');if(dr.hidden){renderDrawer();dr.hidden=false;$('burger').setAttribute('aria-expanded','true')}else closeDrawer()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('drawer').hidden)closeDrawer()});
renderStats();

(function init(){
  let h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}
  if(window.REMOVED&&REMOVED[h]){h=REMOVED[h];try{history.replaceState(null,'','#'+h)}catch(e){}}
  const d=DATA.find(x=>x.id===h);
  if(d){st.type=d.type;st.sel=d.id}
  go();
  if(d&&innerWidth<=960)$('detail').classList.add('open');
})();
